spring.application.name=order-service
server.port=8080

# Cấu hình DataSource kết nối PostgreSQL
# Lấy từ biến môi trường hoặc dùng giá trị mặc định
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quickbite_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:quickbite}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:quickbite_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Cấu hình Actuator Health Endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
